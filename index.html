<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Khảo sát lựa chọn trường tư thục</title>
<style>
  :root {
    --navy: #0E2C54; --red: #9B1B1E; --bg: #f6f7f9; --card: #ffffff; --ink: #1d2433;
    --muted: #5b6474; --line: #d9dee6; --sel: #e8eef7; --ok: #1f6f43;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  header { background: var(--navy); color: #fff; padding: 12px 16px; }
  header b { font-size: 15px; letter-spacing: .2px; }
  .hd { display: flex; align-items: center; gap: 10px; }
  .hd img { width: 40px; height: 40px; flex: none; background: #fff; border-radius: 50%; }
  .hd small { display: block; font-size: 11px; letter-spacing: .4px; opacity: .85; }
  .logo { display: block; width: 100%; max-width: 300px; height: auto; margin: 0 auto 14px; }
  .bar { height: 4px; background: rgba(255,255,255,.25); margin-top: 8px; border-radius: 2px; }
  .bar > i { display: block; height: 100%; width: 0; background: #fff; border-radius: 2px; transition: width .2s; }
  main { max-width: 720px; margin: 0 auto; padding: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 18px 16px; margin-bottom: 14px; }
  h1 { font-size: 20px; margin: 0 0 10px; color: var(--navy); }
  h2 { font-size: 17px; margin: 0 0 8px; color: var(--navy); }
  p { margin: 0 0 10px; }
  .muted { color: var(--muted); font-size: 14px; }
  .q { margin: 16px 0 6px; font-weight: 600; }
  .opts { display: flex; flex-direction: column; gap: 6px; }
  .opts label { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--line);
                border-radius: 8px; cursor: pointer; background: #fff; }
  .opts label:has(input:checked) { background: var(--sel); border-color: var(--navy); }
  .scale { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .scale.s5 { grid-template-columns: repeat(5, 1fr); }
  .scale label { text-align: center; padding: 9px 0; border: 1px solid var(--line); border-radius: 6px; cursor: pointer; background: #fff; }
  .scale label:has(input:checked) { background: var(--navy); color: #fff; border-color: var(--navy); }
  .scale input, .ab input { position: absolute; opacity: 0; pointer-events: none; }
  .ends { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 3px; }
  table.cj { width: 100%; border-collapse: collapse; font-size: 14px; table-layout: fixed; }
  table.cj th, table.cj td { border-bottom: 1px solid var(--line); padding: 8px 6px; vertical-align: top; }
  table.cj th { text-align: left; color: var(--muted); font-weight: 600; width: 30%; }
  table.cj thead td { font-weight: 700; color: var(--navy); text-align: center; background: var(--sel); }
  table.cj td.ca { background: #eef4fb; }  table.cj thead td.ca { background: #d6e4f5; }
  table.cj td.cb { background: #fbf3e4; }  table.cj thead td.cb { background: #f3e1bf; }
  table.cj td.ca, table.cj td.cb { border-left: 3px solid #fff; }
  table.cj tr.trung td.ca, table.cj tr.trung td.cb { background: #fff; color: var(--ink); }
  .ab { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .ab label { text-align: center; padding: 12px 0; border: 2px solid var(--line); border-radius: 8px; font-weight: 700; cursor: pointer; background: #fff; }
  .ab label.ca { background: #eef4fb; border-color: #b9cfe9; }  .ab label.cb { background: #fbf3e4; border-color: #e6cf9f; }
  .ab label:has(input:checked) { border-color: var(--red); background: #fbecec; color: var(--red); }
  .khoi { border-radius: 8px; padding: 2px 10px 10px; margin-top: 10px; }
  .khoi.ca { background: #eef4fb; border-left: 4px solid #8fb2dd; }  .khoi.cb { background: #fbf3e4; border-left: 4px solid #d9b56a; }
  input[type=number] { width: 100%; padding: 10px; font-size: 16px; border: 1px solid var(--line); border-radius: 8px; }
  .nav { display: flex; justify-content: flex-end; gap: 8px; }
  button { font: inherit; padding: 11px 20px; border-radius: 8px; border: 0; background: var(--navy); color: #fff; cursor: pointer; }
  button:disabled { background: #a9b3c2; cursor: not-allowed; }
  .vign { background: #fbf8ef; border-left: 4px solid var(--red); padding: 12px 14px; border-radius: 6px; }
  .err { color: var(--red); font-size: 14px; min-height: 1.2em; }
  pre { white-space: pre-wrap; word-break: break-all; font-size: 12px; background: #f0f2f5; padding: 10px; border-radius: 6px; max-height: 260px; overflow: auto; }
  .test { background: #fff4d6; border: 1px solid #e8c56a; padding: 8px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 12px; }
  @media (max-width: 420px) { table.cj { font-size: 13px; } table.cj th { width: 34%; } }
</style>
</head>

}, fields: ["con_cap", "dang_hoc_tu", "thunhap", "dung_so", "thaido_ai_1", "thaido_ai_2", "thaido_ai_3", "longai_dl_1", "longai_dl_2", "longai_dl_3", "chuy1"] });

PAGES.push({ id: "huongdan_cj", render: function () {

    '<p class="muted" style="margin-top:10px">Mức độ đồng ý của anh/chị với từng ý sau.</p>' +
    q("Tôi tin các yêu cầu của tôi sẽ được xử lý nhanh", scale("m_phanhoi", 7, DY)) +
    q("Thông tin tôi nhận được sẽ chính xác và thống nhất giữa các bộ phận", scale("m_nhatquan", 7, DY)) +
    q("Tôi tin tưởng cách Trường X xử lý thông tin của con tôi", scale("m_tintuong", 7, DY)) +
    q("Nhìn chung tôi sẽ hài lòng với cách Trường X xử lý tình huống này", scale("y_hailong", 7, DY)) +
    q("Để kiểm tra sự chú ý, ở câu này xin hãy chọn số 2", scale("chuy2", 7, DY)) +
    q("Nếu học phí và chất lượng học thuật tương đương trường khác, tôi sẽ chọn Trường X", scale("y_chontruong", 7, DY)) +
    q("Mức học phí cao nhất mỗi năm anh/chị sẵn sàng trả cho Trường X (triệu đồng)", '<input type="number" id="y_hocphi" min="0" max="1000" inputmode="numeric" placeholder="Ví dụ: 120">') + "</div>";
}, fields: ["m_phanhoi", "m_nhatquan", "m_tintuong", "y_hailong", "chuy2", "y_chontruong"],

// ---------- Phần 3: thử nghiệm thông tin (H5) ----------
var tt_batdau = 0, tt_hen = null;
PAGES.push({ id: "thongtin_h5", render: function () {
  return '<div class="card"><h2>Phần 3: Một số thông tin về dịch vụ ở trường tư thục</h2>' +
    '<p class="muted">Xin anh/chị đọc hai đoạn ngắn dưới đây.</p>' +
    "<p>" + TT_O1[R.tt_a] + "</p><p>" + TT_O2[R.tt_b] + "</p>" +
    '<p class="muted" id="demnguoc"></p></div>';
}, onshow: function () {
  tt_batdau = Date.now();
  var btn = document.getElementById("btn"), dn = document.getElementById("demnguoc"), con = TT_GIAY;
  btn.disabled = true; dn.textContent = "Nút Tiếp tục sẽ hiện sau " + con + " giây.";
  if (tt_hen) clearInterval(tt_hen);
  tt_hen = setInterval(function () {
    con -= 1;
    if (con <= 0) { clearInterval(tt_hen); tt_hen = null; btn.disabled = false; dn.textContent = ""; }
    else dn.textContent = "Nút Tiếp tục sẽ hiện sau " + con + " giây.";
  }, 1000);
}, save: function () { R.tt_giay = Math.round((Date.now() - tt_batdau) / 100) / 10; } });

  return '<div class="card"><h2>Phần 3: Ý kiến của anh/chị</h2><p class="muted">Mức độ đồng ý của anh/chị với từng ý sau (1 = hoàn toàn không đồng ý, 7 = hoàn toàn đồng ý).</p>' +

PAGES.push({ id: "hieubiet_h5", render: function () {

    q("Theo luật hiện hành, phụ huynh có quyền yêu cầu nhà trường xóa dữ liệu cá nhân của con không?", radio("k_quyen", [[1, "Có"], [2, "Không"], [3, "Tôi không biết"]])) + "</div>";
}, fields: ["k_vanhanh", "k_quyen"] });

// ---------- Điều khiển ----------
var cur = 0;
function show(i) {
  cur = i; var p = PAGES[i];
  document.getElementById("app").innerHTML = (ENDPOINT ? "" : '<div class="test">Chế độ thử: dữ liệu không được gửi đi.</div>') + p.render() +
    '<p class="err" id="err"></p><div class="nav"><button id="btn">Tiếp tục</button></div>';
  document.getElementById("prog").style.width = Math.round(100 * i / PAGES.length) + "%";
  document.getElementById("btn").onclick = go;
  if (p.onshow) p.onshow();
  window.scrollTo(0, 0);
}
function go() {
  var p = PAGES[cur], ok = true;
  if (document.getElementById("btn").disabled) return;
  (p.fields || []).forEach(function (f) { if (val(f) === null) ok = false; });
  if (p.check && !p.check()) ok = false;
  if (!ok) { document.getElementById("err").textContent = "Xin trả lời đầy đủ các câu trên trang này."; return; }
  (p.fields || []).forEach(function (f) { var v = val(f); R[f] = (p.raw && p.raw.indexOf(f) >= 0) ? v : +v; });
  if (p.save) p.save();
  var nx = p.next ? p.next() : null;
  if (nx === "ket_thuc_som") return finish(false);
  if (cur + 1 < PAGES.length) show(cur + 1); else finish(true);
}
function finish(day_du) {
  R.ketthuc = new Date().toISOString();
  R.thoigian_phut = Math.round((new Date(R.ketthuc) - new Date(R.batdau)) / 6000) / 10;
  R.hoanthanh = day_du ? 1 : 0;
  document.getElementById("prog").style.width = "100%";
  var cam_on = '<div class="card"><h1>Cảm ơn anh/chị!</h1>' + (day_du
      ? "<p>Câu trả lời của anh/chị đã được ghi nhận.</p>" + (LINK_QUA ? '<p>Nếu muốn tham gia bốc thăm quà, xin điền số điện thoại tại <a href="' + LINK_QUA + '" target="_blank" rel="noopener">biểu mẫu riêng này</a> (không gắn với câu trả lời khảo sát).</p>' : "")
      : "<p>Khảo sát này dành cho phụ huynh có con học hoặc dự định học trường tư thục tại Hà Nội. Cảm ơn anh/chị đã dành thời gian.</p>") + "</div>";
  window.__KETQUA = R;
  if (ENDPOINT) {
    fetch(ENDPOINT, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(R) })
      .catch(function () { try { localStorage.setItem("chua_gui_" + R.id, JSON.stringify(R)); } catch (e) {} });
    document.getElementById("app").innerHTML = cam_on;
  } else {
    document.getElementById("app").innerHTML = '<div class="test">Chế độ thử: dữ liệu dưới đây chưa được gửi đi.</div>' + cam_on +
      '<div class="card"><h2>Dữ liệu sẽ được gửi</h2><pre>' + JSON.stringify(R, null, 1) + "</pre></div>";
  }
}
show(0);
</script>
